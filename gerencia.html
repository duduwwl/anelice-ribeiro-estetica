<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><meta name="theme-color" content="#302624"/>
  <title>Área da gerência | Anelice Ribeiro</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23302624'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Georgia' font-size='35' fill='%23d7a7a0'%3EAR%3C/text%3E%3C/svg%3E"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap');
    :root{--ink:#302624;--muted:#766966;--cream:#f8f4ef;--paper:#fffdfb;--rose:#d8aaa3;--deep:#a9716b;--line:#e7ddd6}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.6 Manrope,sans-serif}.wrap{max-width:1000px;margin:auto;padding:0 24px}a{color:inherit;text-decoration:none}.nav{height:82px;border-bottom:1px solid var(--line);background:rgba(248,244,239,.94)}.nav .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:25px}.brand{display:flex;align-items:center;gap:12px}.photo-logo{width:148px;height:45px;display:block;border-radius:4px;background:url('assets/studio.jpg') center 32%/100% auto no-repeat;box-shadow:inset 0 0 0 1px rgba(170,112,105,.34)}.brand strong{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.15em;text-transform:uppercase}.back{font-size:13px;color:var(--muted)}.back:hover{color:var(--deep)}main{padding:75px 0 100px}.hero{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:28px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--deep)}h1{margin:9px 0 0;font:500 clamp(2.8rem,6vw,4.7rem)/1.02 'DM Serif Display',Georgia,serif;letter-spacing:-.04em}h1 em{color:var(--deep);font-style:italic}.card{background:var(--paper);border:1px solid var(--line);box-shadow:0 18px 45px rgba(62,38,32,.07);padding:30px}.login{display:flex;gap:10px;max-width:700px}.login input{flex:1;border:1px solid var(--line);padding:13px;background:#fff;color:var(--ink)}button{font:700 13px Manrope,sans-serif;border:0;border-radius:3px;padding:13px 19px;background:var(--ink);color:#fff;cursor:pointer}.hint{display:block;margin-top:9px;color:var(--muted);font-size:11px}.panel{display:none;margin-top:30px}.panel.show{display:block}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{padding:16px;background:var(--cream);border:1px solid var(--line)}.stat b{display:block;font:500 1.8rem 'DM Serif Display',Georgia,serif}.stat span{font-size:11px;color:var(--muted)}.agenda{display:grid;gap:9px}.appointment{display:grid;grid-template-columns:115px 1fr auto;gap:15px;align-items:center;padding:16px;background:#fff;border:1px solid var(--line)}.date{color:var(--deep);font-size:12px;font-weight:700}.date small{display:block;color:var(--muted);font-weight:500}.info strong{display:block;font-size:13px}.info span{font-size:11px;color:var(--muted)}.delete{border:0;background:none;color:#a75e58;font-size:11px;padding:5px}.empty{color:var(--muted);font-size:13px}.footer{padding:25px 0;background:var(--ink);color:#fff;font-size:11px}.footer .wrap{display:flex;justify-content:space-between;gap:20px}.footer a{color:#dfc9c3}@media(max-width:620px){.wrap{padding:0 18px}.nav{height:70px}.photo-logo{width:112px;height:39px}.brand strong{font-size:11px}.back{font-size:11px}main{padding:52px 0 75px}.hero{display:block}.card{padding:20px}.login{display:flex;flex-direction:column}.summary{grid-template-columns:1fr}.appointment{grid-template-columns:1fr auto;gap:7px}.info{grid-column:1/-1;grid-row:2}.footer .wrap{display:block}.footer a{display:block;margin-top:8px}}
    .brand-logo{width:148px;height:45px;display:block;object-fit:contain;object-position:left center}
    @media(max-width:620px){.brand-logo{width:112px;height:39px}}
   </style>
</head>
<body>
   <header class="nav"><div class="wrap"><a class="brand" href="index.html"><img class="brand-logo" src="assets/logo.png" alt="Logo Anelice Ribeiro Estética"></a><a class="back" href="agenda.html">Voltar para a agenda</a></div></header>
  <main><div class="wrap"><div class="hero"><div><div class="eyebrow">Área da gerência</div><h1>Agenda sob <em>controle.</em></h1></div><div class="eyebrow">Lavras · MG</div></div><div class="card"><p style="margin-top:0;color:var(--muted);font-size:13px">Acesse para consultar os pedidos, serviços escolhidos e horários reservados.</p><div class="login"><input id="password" type="password" value="anelice2026" aria-label="Senha da gerência"/><button id="login" type="button">Entrar na agenda</button></div><span class="hint">Senha de teste preenchida: <strong>anelice2026</strong></span><div class="panel" id="panel"><div class="summary"><div class="stat"><b id="total">0</b><span>agendamentos</span></div><div class="stat"><b id="week">0</b><span>nesta semana</span></div><div class="stat"><b id="next">—</b><span>próximo horário</span></div></div><div class="agenda" id="agenda"></div></div></div></div></main>
  <footer class="footer"><div class="wrap"><span>© 2026 Anelice Ribeiro Estética</span><a href="agenda.html">🗓️ Abrir agenda pública</a></div></footer>
  <script>
    const PASSWORD='anelice2026';const seed=[{id:'demo-1',name:'Marina Souza',phone:'(35) 98888-1122',service:'Limpeza de pele',date:nextWeekday(1),time:'10:00',notes:'Primeiro atendimento'}];const getAppointments=()=>JSON.parse(localStorage.getItem('aneliceAppointments')||'null')||seed;const saveAppointments=list=>localStorage.setItem('aneliceAppointments',JSON.stringify(list));if(!localStorage.getItem('aneliceAppointments'))saveAppointments(seed);
    function nextWeekday(offset=0){const d=new Date();d.setHours(12,0,0,0);while(offset>0){d.setDate(d.getDate()+1);if(d.getDay()>0&&d.getDay()<6)offset--}if(d.getDay()===0)d.setDate(d.getDate()+1);if(d.getDay()===6)d.setDate(d.getDate()+2);return d.toISOString().slice(0,10)}function formatDate(v){return new Date(v+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}).replace('.','')}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function render(){const list=getAppointments().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));document.getElementById('total').textContent=list.length;const today=new Date(),monday=new Date(today);monday.setDate(today.getDate()-(today.getDay()+6)%7);const week=monday.toISOString().slice(0,10);document.getElementById('week').textContent=list.filter(a=>a.date>=week).length;document.getElementById('next').textContent=list[0]?.time||'—';document.getElementById('agenda').innerHTML=list.length?list.map(a=>`<div class="appointment"><div class="date">${formatDate(a.date)}<small>${a.time}</small></div><div class="info"><strong>${esc(a.name)}</strong><span>${esc(a.service)} · ${esc(a.phone)}${a.notes?' · '+esc(a.notes):''}</span></div><button class="delete" onclick="removeAppointment('${a.id}')">Remover</button></div>`).join(''):'<p class="empty">Nenhum agendamento registrado.</p>'}window.removeAppointment=id=>{saveAppointments(getAppointments().filter(a=>a.id!==id));render()};document.getElementById('login').addEventListener('click',()=>{if(document.getElementById('password').value===PASSWORD)document.getElementById('panel').classList.add('show'),render()});
  </script>
</body>
</html>
